<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic cluster map</title>
<!--
  cluster-map.html — interactive hub-and-spoke visualizer for seo-cluster.
  Authored from scratch for the designer-pro-and-seo plugin (no third-party HTML,
  IDs, or class names reused). Renders entirely client-side from injected JSON;
  no network, no build step, no dependencies.

  HOW TO POPULATE: on the CLUSTER_DATA line below, replace the block-comment marker
  together with the `null` sentinel that immediately follows it -- i.e. the whole
  "<marker> null" right-hand side, as one unit -- with the JSON that
  `scripts/seo/serp_cluster.py --serps <blob>` prints (its default, non-`--human`
  output). The marker string appears exactly ONCE in this file (on that line), so a
  single string-replace is unambiguous. Because the marker owns the entire right-hand
  side, BOTH the un-replaced template and the injected result are valid JavaScript --
  you never get two adjacent object literals.

  Left unfilled, CLUSTER_DATA stays null and a tiny built-in sample renders so the page
  is viewable as-is.
-->
<style>
  :root{
    --pm-bg:#10131a; --pm-panel:#181d27; --pm-edge:#2a313f; --pm-ink:#e7ecf3;
    --pm-dim:#9aa6b8; --pm-hub:#f4c95d;
    --pm-informational:#5aa9e6; --pm-commercial:#7ad7a0;
    --pm-transactional:#e6895a; --pm-navigational:#b98fe0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--pm-bg);color:var(--pm-ink);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header.pm-top{padding:18px 22px;border-bottom:1px solid var(--pm-edge)}
  header.pm-top h1{margin:0;font-size:19px;letter-spacing:.2px}
  header.pm-top p{margin:4px 0 0;color:var(--pm-dim);font-size:13px}
  .pm-shell{display:grid;grid-template-columns:1fr 320px;gap:0;min-height:70vh}
  @media (max-width:820px){.pm-shell{grid-template-columns:1fr}}
  .pm-stage{padding:16px}
  .pm-aside{border-left:1px solid var(--pm-edge);padding:16px;background:var(--pm-panel)}
  @media (max-width:820px){.pm-aside{border-left:none;border-top:1px solid var(--pm-edge)}}
  .pm-cluster{background:var(--pm-panel);border:1px solid var(--pm-edge);
    border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .pm-cluster h2{margin:0 0 2px;font-size:15px}
  .pm-tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:.6px;padding:2px 8px;border-radius:999px;color:#0c0f15}
  .pm-meta{color:var(--pm-dim);font-size:12px;margin:2px 0 8px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .pm-link{stroke:var(--pm-edge);stroke-width:1.4}
  .pm-link.pm-sib{stroke-dasharray:4 4;opacity:.7}
  .pm-node text{font-size:12px;fill:var(--pm-ink);pointer-events:none}
  .pm-node circle{stroke:#0c0f15;stroke-width:1.5}
  .pm-node.pm-pillar circle{stroke:var(--pm-hub);stroke-width:2.5}
  .pm-aside h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;
    letter-spacing:.6px;color:var(--pm-dim)}
  .pm-matrix{width:100%;border-collapse:collapse;font-size:12px}
  .pm-matrix th,.pm-matrix td{text-align:left;padding:4px 6px;
    border-bottom:1px solid var(--pm-edge);vertical-align:top}
  .pm-matrix th{color:var(--pm-dim);font-weight:600}
  .pm-single{font-size:12px;color:var(--pm-dim);margin:2px 0}
  .pm-legend{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px;font-size:12px}
  .pm-legend span{display:inline-flex;align-items:center;gap:5px}
  .pm-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  footer.pm-foot{padding:12px 22px;border-top:1px solid var(--pm-edge);
    color:var(--pm-dim);font-size:12px}
</style>
</head>
<body>
<header class="pm-top">
  <h1>Topic cluster map</h1>
  <p>Hub-and-spoke content architecture from SERP-overlap clustering. Pillars carry a gold ring; dashed edges are sibling links.</p>
</header>

<div class="pm-legend" style="padding:0 22px;margin-top:12px">
  <span><i class="pm-dot" style="background:var(--pm-informational)"></i>informational</span>
  <span><i class="pm-dot" style="background:var(--pm-commercial)"></i>commercial</span>
  <span><i class="pm-dot" style="background:var(--pm-transactional)"></i>transactional</span>
  <span><i class="pm-dot" style="background:var(--pm-navigational)"></i>navigational</span>
  <span><i class="pm-dot" style="background:var(--pm-hub)"></i>pillar ring</span>
</div>

<div class="pm-shell">
  <main class="pm-stage" id="pmStage"></main>
  <aside class="pm-aside">
    <h3>Internal-link matrix</h3>
    <div id="pmMatrix"></div>
    <h3 style="margin-top:18px">Singletons</h3>
    <div id="pmSingles"></div>
  </aside>
</div>

<footer class="pm-foot" id="pmFoot"></footer>

<script>
// --- injected data ----------------------------------------------------------
// On the CLUSTER_DATA line, the block-comment marker plus the `null` right after it is
// the single replaceable token (it owns the whole right-hand side): swap that unit for
// serp_cluster.py's default JSON. Both states are valid JS -- un-replaced, CLUSTER_DATA
// is null and PM_SAMPLE renders; replaced, CLUSTER_DATA is the injected object.
var PM_SAMPLE = {
  "params": {"threshold": 3, "top_n": 10, "keywords": 4, "clusters": 1, "singletons": 1},
  "clusters": [
    {"id": 1, "pillar": "best running shoes", "intent": "commercial", "size": 3,
     "spokes": [
       {"keyword": "running shoe reviews", "intent": "commercial", "shared_with_pillar": 3},
       {"keyword": "top running shoes 2026", "intent": "commercial", "shared_with_pillar": 3}],
     "internal_links": [
       {"from":"running shoe reviews","to":"best running shoes","anchor":"best running shoes","type":"spoke_to_pillar"},
       {"from":"top running shoes 2026","to":"best running shoes","anchor":"best running shoes","type":"spoke_to_pillar"},
       {"from":"running shoe reviews","to":"top running shoes 2026","anchor":"top running shoes 2026","type":"spoke_to_sibling"}]}
  ],
  "singletons": [{"keyword": "what is single origin coffee", "intent": "informational"}],
  "link_matrix": []
};
var CLUSTER_DATA = /*__SERP_CLUSTER_JSON__*/ null;
if (CLUSTER_DATA === null) { CLUSTER_DATA = PM_SAMPLE; }  // fall back to the sample

// --- rendering --------------------------------------------------------------
var INTENT_VAR = {
  informational: "var(--pm-informational)", commercial: "var(--pm-commercial)",
  transactional: "var(--pm-transactional)", navigational: "var(--pm-navigational)"
};
function intentColor(i){ return INTENT_VAR[i] || "var(--pm-dim)"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function svgNode(kw, intent, x, y, isPillar){
  var r = isPillar ? 11 : 8;
  var label = kw.length > 30 ? kw.slice(0,29) + "…" : kw;
  var anchor = x < 200 ? "end" : (x > 360 ? "start" : "middle");
  var dx = anchor === "end" ? -(r+4) : (anchor === "start" ? (r+4) : 0);
  var dy = anchor === "middle" ? -(r+6) : 4;
  return '<g class="pm-node ' + (isPillar ? "pm-pillar" : "") + '">' +
    '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+intentColor(intent)+'"></circle>' +
    '<text x="'+(x+dx)+'" y="'+(y+dy)+'" text-anchor="'+anchor+'">'+esc(label)+'</text></g>';
}

function renderCluster(c){
  var W = 560, cx = 280, cy = 150, R = 110;
  var nodes = {}; // keyword -> {x,y}
  nodes[c.pillar] = {x: cx, y: cy};
  var n = c.spokes.length;
  c.spokes.forEach(function(s, i){
    var ang = -Math.PI/2 + (2*Math.PI*i)/Math.max(1,n);
    nodes[s.keyword] = {x: cx + R*Math.cos(ang), y: cy + R*Math.sin(ang)};
  });
  var edges = "";
  (c.internal_links || []).forEach(function(l){
    if (l.type === "pillar_to_spoke") return; // pillar<->spoke drawn once via spoke_to_pillar
    var a = nodes[l.from], b = nodes[l.to];
    if (!a || !b) return;
    var cls = l.type === "spoke_to_sibling" ? "pm-link pm-sib" : "pm-link";
    edges += '<line class="'+cls+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'"></line>';
  });
  var pts = svgNode(c.pillar, c.intent, cx, cy, true);
  c.spokes.forEach(function(s){
    pts += svgNode(s.keyword, s.intent, nodes[s.keyword].x, nodes[s.keyword].y, false);
  });
  var tag = '<span class="pm-tag" style="background:'+intentColor(c.intent)+'">'+esc(c.intent)+'</span>';
  return '<section class="pm-cluster"><h2>Cluster '+c.id+' &mdash; pillar: '+esc(c.pillar)+'</h2>' +
    '<div class="pm-meta">'+tag+' &nbsp; '+c.size+' keywords</div>' +
    '<svg viewBox="0 0 '+W+' 300" role="img" aria-label="Cluster '+c.id+' hub and spoke diagram">' +
    edges + pts + '</svg></section>';
}

function renderMatrix(d){
  var rows = "";
  (d.clusters || []).forEach(function(c){
    (c.internal_links || []).forEach(function(l){
      if (l.type === "pillar_to_spoke") return;
      rows += '<tr><td>'+esc(l.from)+'</td><td>'+esc(l.to)+'</td><td>'+esc(l.anchor)+'</td></tr>';
    });
  });
  return '<table class="pm-matrix"><thead><tr><th>From</th><th>To</th><th>Anchor text</th></tr></thead>' +
    '<tbody>'+(rows || '<tr><td colspan="3">No links.</td></tr>')+'</tbody></table>';
}

function render(){
  var d = CLUSTER_DATA || {};
  document.getElementById("pmStage").innerHTML =
    (d.clusters || []).map(renderCluster).join("") || "<p>No clusters.</p>";
  document.getElementById("pmMatrix").innerHTML = renderMatrix(d);
  document.getElementById("pmSingles").innerHTML =
    ((d.singletons || []).map(function(s){
      return '<div class="pm-single">&bull; '+esc(s.keyword)+' ['+esc(s.intent)+']</div>';
    }).join("")) || '<div class="pm-single">None.</div>';
  var p = d.params || {};
  document.getElementById("pmFoot").textContent =
    "Source: Tier 2 (serp_cluster.py, SERP-overlap, threshold " + (p.threshold||"?") +
    " of top-" + (p.top_n||"?") + "). Volume / CPC / difficulty are not shown — connect DataForSEO / Semrush (Tier 1).";
}
render();
</script>
</body>
</html>
